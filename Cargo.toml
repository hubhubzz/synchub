[package]
name = "synchub"
version = "0.1.0"
edition = "2021"
description = "A Rust CLI for syncing a local folder to Google Drive"

[dependencies]
base64 = "0.22"
dirs = "6"
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
webbrowser = "1"

[[bin]]
name = "synchub"
path = "src/main.rs"
